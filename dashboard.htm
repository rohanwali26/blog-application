<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBlog - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2 class="logo">MyBlog</h2>

        <div class="nav-links">
            <a href="index.htm">Home</a>
            <a href="dashboard.htm">Dashboard</a>
            <a href="create-blog.htm">Create Blog</a>
            <a href="login.htm">Logout</a>
        </div>
    </nav>
</header>

<main class="dashboard">

    <div class="dashboard-header">

        <div>
            <h1>Dashboard</h1>
            <p>Manage your blogs and view your activity.</p>
        </div>

        <a href="create-blog.htm" class="btn">
            + Create Blog
        </a>

    </div>

    <section class="stats">

        <div class="stat-card">
            <h3>Total Blogs</h3>
            <p class="stat-total">0</p>
        </div>

        <div class="stat-card">
            <h3>Published</h3>
            <p class="stat-published">0</p>
        </div>

        <div class="stat-card">
            <h3>Drafts</h3>
            <p>1</p>
        </div>

    </section>

    <section class="dashboard-blogs">

        <h2>My Blogs</h2>

        <div class="dashboard-blog-list">
            <p>Loading blogs...</p>
        </div>

    </section>

</main>

<footer>
    <p>© 2026 MyBlog. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
