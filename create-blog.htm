<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBlog - Create Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2 class="logo">MyBlog</h2>

        <div class="nav-links">
            <a href="index.htm">Home</a>
            <a href="dashboard.htm">Dashboard</a>
            <a href="create-blog.htm">Create Blog</a>
            <a href="login.htm">Logout</a>
        </div>
    </nav>
</header>

<main class="create-blog-container">

    <div class="create-blog-box">

        <h1>Create New Blog</h1>
        <p>Share your thoughts and ideas with the world.</p>

        <form id="blogForm">

            <label for="blogTitle">Blog Title</label>

            <input
                type="text"
                id="blogTitle"
                placeholder="Enter your blog title"
                required
            >

            <label for="category">Category</label>

            <select id="category" required>
                <option value="">Select a category</option>
                <option value="technology">Technology</option>
                <option value="programming">Programming</option>
                <option value="education">Education</option>
                <option value="travel">Travel</option>
                <option value="lifestyle">Lifestyle</option>
            </select>

            <label for="image">Featured Image URL</label>

            <input
                type="url"
                id="image"
                placeholder="Enter image URL"
            >

            <label for="content">Blog Content</label>

            <textarea
                id="content"
                rows="12"
                placeholder="Write your blog here..."
                required
            ></textarea>

            <div class="create-buttons">

                <button type="submit" class="publish-btn">
                    Publish Blog
                </button>

                <button type="button" class="draft-btn">
                    Save as Draft
                </button>

            </div>

        </form>

    </div>

</main>

<footer>
    <p>© 2026 MyBlog. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
